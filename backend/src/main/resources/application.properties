spring.application.name=backend 
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}

api.security.token.secret=${MASTER_PASS}

spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

cors.allowed.origins=${CORS_ORIGINS:http://localhost:3000}
api.security.token.issuer=${TOKEN_ISSUER:barbershop-api}
api.security.token.expiration-hours=${TOKEN_EXPIRATION_HOURS:2}
api.security.token.timezone-offset=${TOKEN_TIMEZONE_OFFSET:-03:00}

logging.file.name=backend-api.log
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=DEBUG
logging.level.com.barbershop=DEBUG

# OpenAPI / Swagger Configuration
springdoc.swagger-ui.path=/openapi